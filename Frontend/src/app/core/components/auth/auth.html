<h1 mat-dialog-title class="text-center">
  {{ isRegisterMode ? 'Register' : 'Login' }}
</h1>

<form [formGroup]="authForm" (ngSubmit)="onSubmit()" mat-dialog-content>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username" />
  </mat-form-field>

   <mat-form-field appearance="outline" class="w-100" *ngIf="isRegisterMode">
    <mat-label>Role</mat-label>
    <mat-select formControlName="role">
      <mat-option value="ADMIN">Admin</mat-option>
      <mat-option value="DOCTOR">Doctor</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100" *ngIf="isRegisterMode">
    <mat-label>Confirm Password</mat-label>
    <input matInput type="password" formControlName="confirmPassword" />
    <mat-error *ngIf="authForm.errors">Passwords do not match</mat-error>
  </mat-form-field>

  <div mat-dialog-actions class="mt-3 d-flex justify-content-between">
    <button mat-button type="button" (click)="close()">Cancel</button>
    <div>
      <button mat-button type="button" (click)="toggleMode()">
        {{ isRegisterMode ? 'Already have an account? Login' : 'Register instead' }}
      </button>
      <button mat-flat-button color="primary" type="submit" [disabled]="!authForm.valid">
        {{ isRegisterMode ? 'Register' : 'Login' }}
      </button>
    </div>
  </div>
</form>
